# 需求画像:政策监管动态库(通用数据采集平台 · 第二实例,文档型)
# 用途:证明"同一套引擎零改动,只换画像"——记录原型=文档型(发布后内容不变、状态跃迁),
# 去重键=文号、无金额三态、线索引擎关闭、主体=发布机关、覆盖维度=主题。
# 本文件是 design/platform/04 多视角验证里"跨原型压测"的落地样本。

need:
  id: policy_watch
  name: 政策监管动态库
  owner: 合规负责人
  priority: B
  timeliness_sla: 日级
  primary_behaviors: [G1, G5]
  languages: [zh]
  regions: [中国大陆]

compliance:
  data_categories: [政策法规, 标准, 监管通报]
  personal_info: false
  collection_boundary: 仅公开渠道
  retention: 永久保留
  usage_limit: 内部决策参考

record_schemas:
  - file: schema/policy.schema.json
    archetype: 文档型
    min_publish_fields: [doc_id, title, issuer, doc_type, status, published_date, sources]
    dedup_key: [doc_number]

entity_links: [issuer]

record:
  id_prefix: POL
  envelope: {id_field: doc_id, status_field: ""}     # 记录号写进 doc_id;status 是业务状态(征求意见/生效…),系统状态不注入
  field_roles:
    title: title
    subject: issuer
    subject_key: doc_number
    subject_type: doc_type
    dim1: topics[0]
    dim2: doc_type
    region: region
    grade: doc_type
    tags_a: topics
    tags_b: affected_industries
    occurred_date: published_date
    disclosed_date: effective_date
    record_type: record_type
  role_labels: {title: 标题, subject: 发布机关, subject_key: 文号, subject_type: 文种, dim1: 主题, dim2: 文种,
                region: 地区, grade: 文种, tags_a: 主题, tags_b: 涉及行业, occurred_date: 发布日,
                disclosed_date: 生效日, record_type: 类型}
  record_types:
    values: [正式文件, 征求意见, 不该入库]
    default: 正式文件
    out_of_scope: 不该入库
    advisory:
      value: 征求意见
      hints: [征求意见, 意见稿, 公开征求]
      subject_blank_values: []
  grade_order: [法律, 行政法规, 部门规章, 规范性文件, 国家标准, 行业标准, 征求意见稿, 监管通知, 其他]
  completeness_weights: {doc_number: 6, issuer: 5, doc_type: 4, status: 4, published_date: 3,
                         effective_date: 4, topics: 3, affected_industries: 3, summary: 3, related_products: 2}
  dedup:
    subject_roles: [subject_key, subject+title]     # 文号唯一;无文号时 发布机关|标题
    type_role: null                                  # 文档型不看"类型交集"
    date_role: occurred_date
    window_days: 3650                                # 文号在整个库里唯一,时间窗放到最大
  confidence_by_credibility: {S1: 官方发布, S2: 协会转载, S3: 媒体转述, S4: 未核实}

dictionaries:
  file: schema/policy_dictionaries.yaml
  discovery_terms_file: config/keyword_matrix_policy.yaml
  relevance_term_fields: [event_terms]

coverage:
  dimension_role: dim1
  dictionary_key: topics
  query_templates: ["{ind} 征求意见稿", "{ind} 管理办法 发布"]
  short_names: {关键信息基础设施: 关基, 个人信息保护: 个保}
  placeholders: [其他, 未分类, 未知, 词表外]

sources:
  seed_file: config/seed_sources_policy.yaml
  reputation_registry: config/policy_issuers.yaml
  repost_detection: true
  discovery_file: config/discovery_policy.yaml
  credibility_levels:
    confirm_allowed: [S1]
    levels:
      S1: 部委官网/全国人大/司法机关正式发布
      S2: 行业协会转载
      S3: 媒体解读
  column_discovery:
    hint_words: [政策, 法规, 规章, 标准, 征求意见, 通知公告, 政策文件, 政府信息公开, 部门文件, 规范性文件, 意见征集, 立法]
    path_hints: [zhengce, fagui, zcfg, tzgg, gongkai, xxgk, bmwj]
  prospect:
    selftest_query: 网络安全 征求意见稿
  skip_hosts_extra: []

quality:
  model: 事实核实型
  assertion_tristate_fields: []
  double_review_fields: []
  screen:
    goal: 判断是否为中国网络安全/数据安全/个人信息保护相关的法规、规章、标准、征求意见稿或监管专项通知的正式发布
    include_rules:
      - "法律/行政法规/部门规章/规范性文件的发布、修订、废止"
      - "国家标准/行业标准的发布、征求意见"
      - "监管部门发布的专项通知、管理办法、实施细则"
    exclude_rules:
      - "解读课程、培训报名、招聘、会议通知"
      - "媒体对政策的转述与评论(非原文发布)"
      - "企业合规产品宣传"
    reminder: "只认『发布方是有权机关、内容是文件本身或其征求意见稿』;二手解读一律判 false"
  extract_rules:
    - "doc_number 只填正文中出现的完整文号/标准号(如 国办发〔2024〕3号、GB/T 39786-2021);没有就留空"
    - "status 按文中状态:征求意见/发布/生效/修订/废止;征求意见稿的 record_type=『征求意见』"
    - "effective_date 只填原文明确写出的生效日期;写了『自发布之日起施行』则等于 published_date"
  scope_guard:
    exclude_patterns: ["培训|报名|课程|招聘|研讨会|论坛|直播"]
    include_override_patterns: ["〔\\d{4}〕|第\\d+号|GB/T|征求意见稿|管理办法|实施细则"]
  assertions:
    tristate_fields: []
    isolation: []

update:
  lagged_fields:
    - {field: effective_date, typical_lag_days: 90}
  followup_schedule: [30, 90, 180]
  followup_triggers:
    - {field: status, when: value_not_in, values: [生效, 废止], reason: 状态未落定(待生效/修订)}
    - {field: effective_date, when: empty, reason: 生效日期未披露}
  followup_search:
    subject_role: subject_key
    query_suffixes: [生效, 修订, 废止, 解读]
    link_templates:
      国务院政策文件库: "https://www.gov.cn/zhengce/xxgk/sousuo.htm?q={q}"
      国家标准全文公开系统: "https://openstd.samr.gov.cn/bzgk/gb/std_list?p.p2={q}"
  watch_kinds: [issuer, topic]
  expansion_rules: []
  burst_signals: [部委发布会]
  close_condition: 被后续法规废止 或 长期稳定生效

outputs:
  reports:
    - {name: 月度政策动态简报, cycle: 月, audience: 合规与产品}
  alerts:
    - {condition: "doc_type in [法律,行政法规] 且 status=发布", channel: 内部IM, latency: 小时}
  kpi: [覆盖率>=95%, 披露到入库<=24h]
  leads_engine:
    enabled: false
  reports_engine:
    crosstab: {row_role: dim1, col_roles: [grade, tags_b]}
    amount_sum: null
    status_count: null
    missing_field: {field: related_products}
  digest:
    title: 政策动态日报
    group_roles: [dim1, grade]
    rank_role: grade
    advisory_split: true

ui:
  record_label: 政策
  tabs:
    dashboard: {label: 仪表盘, enabled: true}
    events: {label: 政策, enabled: true}
    review: {label: 复核台, enabled: true}
    followups: {label: 跟踪, enabled: true}
    leads: {label: 线索, enabled: false}
    sources: {label: 数据源, enabled: true}
    crawl: {label: 采集, enabled: true}
    actions: {label: 系统动作, enabled: true}
    digest: {label: 日报, enabled: true}
    settings: {label: 设置, enabled: true}
  list_columns:
    - {role: title}
    - {role: record_type}
    - {role: subject}
    - {role: grade}
    - {role: tags_a}
    - {role: status, label: 状态}
    - {role: occurred_date}
  filters:
    - {role: status, label: 状态}
    - {role: grade}
  detail_sections:
    - {kind: kv, roles: [subject, subject_key, grade, dim1, occurred_date, disclosed_date]}
    - {kind: tags, roles: [tags_a, tags_b]}
    - {kind: text, path: summary, label: 摘要}
    - {kind: list, path: related_products, label: 对应合规产品}
    - {kind: sources}
  dashboard_tiles:
    - {key: events_total, label: 政策总数, go: events, desc: "库里全部政策记录"}
    - {key: events_published, label: 已发布, go: events, filter: {status: live}, desc: "已复核发布的政策记录"}
    - {key: docs_total, label: 采集文档, go: crawl, desc: "采集入库的原始页面"}
    - {key: pending_review, label: 待复核, go: review, desc: "等人工核对后才能发布"}
    - {key: followups_open, label: 跟踪待办, go: followups, desc: "待跟踪生效/修订/废止"}

demo:
  samples:
    - {title: 关于公开征求《网络数据安全管理条例(征求意见稿)》意见的通知,
       text: "国家互联网信息办公室起草了《网络数据安全管理条例(征求意见稿)》,现向社会公开征求意见。意见反馈截止时间为2026年8月30日。本条例旨在规范网络数据处理活动,保障数据安全。"}
    - {title: 工业和信息化部发布《工业数据分类分级指南》(工信厅信发〔2026〕12号),
       text: "工业和信息化部办公厅印发《工业数据分类分级指南》,文号工信厅信发〔2026〕12号,自发布之日起施行。指南明确了工业数据分类分级方法与保护要求。"}

mock:
  screen_keywords: [征求意见, 管理办法, 条例, 规定, 标准, 发布, 施行, 通知, 指南, 办法, 法, 规范]
  extract_rules:
    - {path: doc_number, regex: "(?:文号)?([\\u4e00-\\u9fff]{2,10}〔\\d{4}〕\\d+号|GB/T\\s?\\d{4,6}(?:-\\d{4})?)"}
    - {path: issuer, regex: "(国家互联网信息办公室|工业和信息化部|公安部|全国人大常委会|国务院|国家标准委|中国人民银行|国家密码管理局)"}
    - {path: doc_type, when_contains: [征求意见稿], value: 征求意见稿}
    - {path: doc_type, when_contains: [条例], value: 行政法规}
    - {path: doc_type, when_contains: [指南, 办法, 规定], value: 规范性文件}
    - {path: status, when_contains: [征求意见], value: 征求意见}
    - {path: status, when_contains: [施行, 发布], value: 发布}
    - {path: record_type, when_contains: [征求意见], value: 征求意见}
    - {path: topics, when_contains: [数据安全, 数据], append: 数据安全}
    - {path: topics, when_contains: [网络安全], append: 网络安全}
    - {path: topics, when_contains: [个人信息], append: 个人信息保护}

benchmark:
  baselines:
    - {name: 国务院政策文件库, type: 官方汇总, cycle: 月}
  target_recall: 0.95
