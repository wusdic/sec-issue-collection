# 源发现引擎配置 v0.1(详细设计第 8 节, M10)
# D4 导航/聚合站 与 D5 找源专用检索 的配置; D1-D3 为文档流水线伴生, 无需配置

version: "0.1"

# ---------- D4: 导航与聚合站(每周爬取, 产出候选源而非事件文档) ----------
directories:
  - name: 腾讯玄武实验室每日安全动态
    url: https://sec.today/
    note: 每日聚合, 其引用的中文源是高质量候选
  - name: SecWiki 安全维基聚合
    url: https://www.sec-wiki.com/
    note: 安全资讯聚合+导航, 周报页含大量渠道
  - name: Sec-News 安全文摘(GitHub)
    url: https://github.com/Le0nsec/SecCrawler
    note: 代表性聚合项目, 同类 awesome 仓库由 github_awesome 适配器按 topic 检索扩展
  - name: GitHub awesome 安全公众号/周报清单(topic 检索)
    url: https://github.com/search?q=安全+公众号+awesome
    note: 批量提取仓库 README 中的公众号名与站点链接
  - name: 公开安全类 RSS/OPML 合集
    url: multi
    note: 命中一个 OPML 即批量导入其全部条目为候选

# ---------- D5: 找源专用检索(每周跑多引擎; 目的是找渠道, 不是找事件) ----------
# 经验:词堆太多会把召回压死(搜索引擎按 AND 收紧)。实测「网警 处罚」两个词就能捞到
# 一批典型执法通报公众号,而「网信办 处罚 解读 公众号」几乎搜不到东西。
# 故找源词以 **2 词组合** 为主:主体词 × 动作词 —— 主体决定"谁在发",动作决定"发什么"。
query_recipes:
  # 谁在发(执法/监管/司法主体,也是通报的落款方)
  subject_terms:
    [网警, 网信办, 网安, 公安, 公安局, 派出所, 通信管理局, 工信部, 市场监管,
     检察院, 法院, 人民银行, 金融监管, 证监会, 保密局, 密码管理局, 网络安全协会]
  # 发什么(执法/通报口径,中文语料里最稳定的检索锚点)
  action_terms:
    [处罚, 通报, 查处, 约谈, 立案, 罚款, 行政处罚, 案例, 曝光, 整治, 责令改正,
     判决, 起诉, 侦破, 打击, 净网, 专项行动, 风险提示, 安全通报]
  # 事件本体词(与动作词组合,覆盖"非执法口径"的事件报道渠道)
  event_terms:
    [数据泄露, 信息泄露, 勒索病毒, 勒索攻击, 黑客攻击, 网络攻击, 入侵,
     个人信息, 侵犯公民个人信息, 爬虫, 内鬼, 数据安全, 网络安全事件]
  # 渠道词(只与少量词搭配,用来直接命中"聚合/周报"类渠道)
  channel_terms: [安全周报, 安全月报, 事件盘点, 情报汇总]
  max_combos: 200         # 组合上限(总找源词 = 固定词 + 覆盖空白词 + 组合,再受 prospect_query_cap 截断)
  # 注意:这里只是"原料池",不是最终跑的词表。哪些词真跑、跑多少,由关键词进化机制
  # (services/query_evolution.py)按历史产出决定:
  #   · 每条词按轮记账(结果 / 有效结果 / 新渠道 / 最终进源库的);
  #   · 2 词组合拆成 锚点 + 限定词,锚点单独也会跑,于是能算出"加这个限定词到底帮不帮忙"
  #     —— 「零售 数据泄露」若不如「数据泄露」,增益就 <1,零售会退出组合池(仍可单独跑);
  #   · 表现好的词派生变异(去掉限定词 / 换动作词),再从已采语料里挖新说法进探索队列;
  #   · 连着几轮空手只是"歇着"(低频复测),不是淘汰——没有哪个网站天天出一堆报道。
  # 所以往上面几个池子里加词是安全的:加错了机制会自己把它降级,不用怕污染词表。

# 固定找源词:保持 2-3 词,宁短勿长
source_search_queries:
  - 网警 处罚
  - 网信办 通报
  - 数据泄露 通报
  - 勒索病毒 应急响应
  - 安全周报 汇总
  - 网络安全 事件 盘点
  - 侵犯公民个人信息 判决
  - 工控安全 事件

# ---------- 评分与自动试运行(8.2) ----------
scoring:
  weight_channels: 2.0        # 发现通道数
  weight_hits30d: 0.5         # 近30天命中(封顶10次)
  weight_cluster_primary: 3.0 # 曾为同稿簇首发
  weight_llm_relevance: 2.0   # LLM 内容相关度 0-1
  weight_freshness: 1.0       # 更新活跃度
  auto_trial_threshold: 8.0   # ≥8 自动建 trial 源(14天试运行)
  trial_days: 14

# ---------- 试运行源自动定级/自动淘汰(services/grading.py) ----------
# 目标是尽量不用人工点"转正"。规则只用客观可验证的事实与试运行期实际产出:
#   S1 只给域名本身能证明官方身份的(.gov.cn 等政务域名 + 下面这份名录);
#   S3 给试运行达标的媒体源(S3 不能支撑"已确认"金额,自动给不突破发布红线);
#   S2(企业自披露)能支撑已确认金额,属红线,机器只给建议不自动执行。
grading:
  auto_grade_enabled: true
  trial_days: 14                  # 试运行满这么多天才下结论
  promote_min_docs: 5             # 试运行期至少产出这么多篇才够样本
  promote_min_relevant_ratio: 0.3 # 产出中被判为相关的比例达标 → 自动转正 S3
  retire_min_docs: 20             # 样本达到这么多篇才允许判"噪声源"
  retire_max_relevant_ratio: 0.05 # 相关率低到这个程度 → 自动淘汰
  # 非 .gov.cn 但同样权威的官方机构/法定披露平台(注册域即可)
  official_domains:
    - cert.org.cn                 # 国家互联网应急中心 CNCERT
    - cnvd.org.cn                 # 国家信息安全漏洞共享平台
    - cnnvd.org.cn                # 国家信息安全漏洞库
    - sse.com.cn                  # 上交所
    - szse.cn                     # 深交所
    - bse.cn                      # 北交所
    - cninfo.com.cn               # 巨潮资讯(法定信息披露平台)
    - court.gov.cn                # 中国裁判文书网
    - creditchina.gov.cn          # 信用中国
    - pbc.gov.cn                  # 人民银行
    - nfra.gov.cn                 # 金融监管总局
    - csrc.gov.cn                 # 证监会

# ---------- LLM 相关度初评抽样 ----------
llm_relevance_probe:
  pages: [首页, 最近文章列表]
  sample_articles: 10
  prompt_goal: 判断该渠道是否持续产出国内安全事件相关的原创或一手内容(0-1 打分+理由)
